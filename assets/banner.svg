<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d1b69;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <style>
      @font-face { font-family: 'banner'; src: local('Segoe UI'), local('Helvetica Neue'), local('Arial'); }
      .title { font-family: 'banner', sans-serif; font-size: 56px; font-weight: 700; fill: url(#textGrad); }
      .subtitle { font-family: 'banner', sans-serif; font-size: 22px; font-weight: 400; fill: #94a3b8; }
      .code { font-family: 'Courier New', 'Consolas', monospace; font-size: 13px; fill: #64748b; }
      .code-hl { font-family: 'Courier New', 'Consolas', monospace; font-size: 13px; fill: #38bdf8; }
      .code-str { font-family: 'Courier New', 'Consolas', monospace; font-size: 13px; fill: #a78bfa; }
      .code-kw { font-family: 'Courier New', 'Consolas', monospace; font-size: 13px; fill: #f472b6; }
      .tag { font-family: 'banner', sans-serif; font-size: 12px; font-weight: 500; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="300" fill="url(#bgGrad)" rx="12" />

  <!-- 背景装饰圆 -->
  <circle cx="100" cy="250" r="180" fill="#3b82f6" opacity="0.03" />
  <circle cx="1100" cy="50" r="200" fill="#8b5cf6" opacity="0.04" />
  <circle cx="600" cy="300" r="250" fill="#6366f1" opacity="0.02" />

  <!-- 背景网格点 -->
  <g opacity="0.06" fill="#94a3b8">
    <circle cx="50" cy="30" r="1.2" /><circle cx="100" cy="30" r="1.2" /><circle cx="150" cy="30" r="1.2" />
    <circle cx="200" cy="30" r="1.2" /><circle cx="250" cy="30" r="1.2" /><circle cx="300" cy="30" r="1.2" />
    <circle cx="50" cy="70" r="1.2" /><circle cx="100" cy="70" r="1.2" /><circle cx="150" cy="70" r="1.2" />
    <circle cx="200" cy="70" r="1.2" /><circle cx="250" cy="70" r="1.2" /><circle cx="300" cy="70" r="1.2" />
    <circle cx="50" cy="110" r="1.2" /><circle cx="100" cy="110" r="1.2" /><circle cx="150" cy="110" r="1.2" />
    <circle cx="900" cy="230" r="1.2" /><circle cx="950" cy="230" r="1.2" /><circle cx="1000" cy="230" r="1.2" />
    <circle cx="1050" cy="230" r="1.2" /><circle cx="1100" cy="230" r="1.2" /><circle cx="1150" cy="230" r="1.2" />
    <circle cx="900" cy="270" r="1.2" /><circle cx="950" cy="270" r="1.2" /><circle cx="1000" cy="270" r="1.2" />
    <circle cx="1050" cy="270" r="1.2" /><circle cx="1100" cy="270" r="1.2" /><circle cx="1150" cy="270" r="1.2" />
  </g>

  <!-- 左侧图标：齿轮+蛇组合 -->
  <g transform="translate(100, 150)" filter="url(#glow)">
    <!-- 外齿轮 -->
    <g fill="none" stroke="url(#iconGrad)" stroke-width="3.5" opacity="0.9">
      <circle cx="0" cy="0" r="42" />
      <!-- 齿轮齿 -->
      <rect x="-6" y="-58" width="12" height="16" rx="3" fill="url(#iconGrad)" stroke="none" />
      <rect x="-6" y="42" width="12" height="16" rx="3" fill="url(#iconGrad)" stroke="none" />
      <rect x="-58" y="-6" width="16" height="12" rx="3" fill="url(#iconGrad)" stroke="none" />
      <rect x="42" y="-6" width="16" height="12" rx="3" fill="url(#iconGrad)" stroke="none" />
      <rect x="31" y="-46" width="12" height="16" rx="3" fill="url(#iconGrad)" stroke="none" transform="rotate(45, 37, -38)" />
      <rect x="-43" y="30" width="12" height="16" rx="3" fill="url(#iconGrad)" stroke="none" transform="rotate(45, -37, 38)" />
      <rect x="-43" y="-46" width="12" height="16" rx="3" fill="url(#iconGrad)" stroke="none" transform="rotate(-45, -37, -38)" />
      <rect x="31" y="30" width="12" height="16" rx="3" fill="url(#iconGrad)" stroke="none" transform="rotate(-45, 37, 38)" />
    </g>
    <!-- 内圆 -->
    <circle cx="0" cy="0" r="26" fill="none" stroke="url(#iconGrad)" stroke-width="3" opacity="0.6" />
    <!-- Python 蛇形 S 曲线 -->
    <path d="M-10,-16 C-10,-10 -4,-8 0,-4 C4,0 10,2 10,8 C10,14 4,16 0,16"
          fill="none" stroke="url(#snakeGrad)" stroke-width="4.5" stroke-linecap="round" />
    <!-- 蛇眼 -->
    <circle cx="-8" cy="-16" r="2.5" fill="#fbbf24" />
    <circle cx="8" cy="16" r="2.5" fill="#f59e0b" />
  </g>

  <!-- 中间文字区域 -->
  <g transform="translate(440, 120)">
    <text class="title" x="0" y="0" dominant-baseline="middle">Python Manager</text>
    <text class="subtitle" x="2" y="40">Python 管理工具箱</text>
    <text class="subtitle" x="2" y="68" style="font-size:15px;fill:#64748b;">A GUI toolkit for Python environment management</text>
  </g>

  <!-- 功能标签 -->
  <g transform="translate(442, 210)">
    <rect x="0" y="0" width="120" height="26" rx="13" fill="#3b82f6" opacity="0.15" />
    <text class="tag" x="60" y="17" text-anchor="middle" fill="#60a5fa">PyInstaller</text>

    <rect x="132" y="0" width="100" height="26" rx="13" fill="#8b5cf6" opacity="0.15" />
    <text class="tag" x="182" y="17" text-anchor="middle" fill="#a78bfa">Env Clone</text>

    <rect x="244" y="0" width="110" height="26" rx="13" fill="#6366f1" opacity="0.15" />
    <text class="tag" x="299" y="17" text-anchor="middle" fill="#818cf8">Deps Analyze</text>

    <rect x="366" y="0" width="100" height="26" rx="13" fill="#a855f7" opacity="0.15" />
    <text class="tag" x="416" y="17" text-anchor="middle" fill="#c084fc">Portable</text>
  </g>

  <!-- 右侧终端装饰 -->
  <g transform="translate(920, 45)">
    <!-- 终端窗口 -->
    <rect x="0" y="0" width="240" height="160" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" opacity="0.8" />
    <!-- 标题栏 -->
    <rect x="0" y="0" width="240" height="28" rx="8" fill="#1e293b" opacity="0.9" />
    <rect x="0" y="14" width="240" height="14" fill="#1e293b" opacity="0.9" />
    <circle cx="16" cy="14" r="4.5" fill="#ef4444" opacity="0.8" />
    <circle cx="32" cy="14" r="4.5" fill="#eab308" opacity="0.8" />
    <circle cx="48" cy="14" r="4.5" fill="#22c55e" opacity="0.8" />
    <text x="120" y="18" text-anchor="middle" style="font-family:'Courier New',monospace;font-size:11px;fill:#475569;">terminal</text>
    <!-- 代码行 -->
    <text class="code-kw" x="14" y="50">$</text>
    <text class="code-hl" x="26" y="50">python-manager</text>
    <text class="code" x="140" y="50">--pack</text>
    <text class="code" x="14" y="70">Building...</text>
    <text class="code-str" x="14" y="90">&#x2713; PyInstaller ready</text>
    <text class="code-str" x="14" y="110">&#x2713; Dependencies resolved</text>
    <text class="code-str" x="14" y="130">&#x2713; Portable package created</text>
    <text class="code-kw" x="14" y="150">$</text>
    <rect x="26" y="142" width="8" height="13" fill="#60a5fa" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0;0.7" dur="1.2s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- 底部装饰线 -->
  <rect x="0" y="294" width="1200" height="6" fill="url(#textGrad)" opacity="0.6" />

</svg>
