<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap');
      .card-title { font-family: 'Inter', 'Segoe UI', sans-serif; font-size: 17px; font-weight: 700; fill: #1a1a2e; }
      .card-point { font-family: 'Inter', 'Segoe UI', sans-serif; font-size: 12.5px; fill: #4a4a6a; }
      .card-icon { font-size: 36px; }
      .dot { fill: #7c5cbf; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0ecf9"/>
      <stop offset="100%" stop-color="#e8f0fe"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f6ff"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c5cbf"/>
      <stop offset="100%" stop-color="#6a8cef"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#7c5cbf" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bg)"/>

  <!-- Card 1: PyInstaller Packaging -->
  <g transform="translate(24, 28)" filter="url(#shadow)">
    <rect width="272" height="344" rx="16" fill="url(#card1)" stroke="#e0d8f0" stroke-width="1"/>
    <rect width="272" height="5" rx="3" y="0" fill="url(#accent1)"/>
    <text x="136" y="62" text-anchor="middle" class="card-icon">📦</text>
    <text x="136" y="100" text-anchor="middle" class="card-title">PyInstaller Packaging</text>
    <line x1="56" y1="116" x2="216" y2="116" stroke="#e0d8f0" stroke-width="1"/>
    <!-- Points -->
    <circle cx="40" cy="148" r="4" class="dot"/>
    <text x="52" y="152" class="card-point">One-click packaging</text>
    <text x="52" y="168" class="card-point">with GUI interface</text>
    <circle cx="40" cy="200" r="4" class="dot"/>
    <text x="52" y="204" class="card-point">Custom icon, resources</text>
    <text x="52" y="220" class="card-point">&amp; output directory</text>
    <circle cx="40" cy="252" r="4" class="dot"/>
    <text x="52" y="256" class="card-point">Drag &amp; drop file support</text>
  </g>

  <!-- Card 2: Environment Cloning -->
  <g transform="translate(318, 28)" filter="url(#shadow)">
    <rect width="272" height="344" rx="16" fill="url(#card1)" stroke="#e0d8f0" stroke-width="1"/>
    <rect width="272" height="5" rx="3" y="0" fill="url(#accent1)"/>
    <text x="136" y="62" text-anchor="middle" class="card-icon">🧬</text>
    <text x="136" y="100" text-anchor="middle" class="card-title">Environment Cloning</text>
    <line x1="56" y1="116" x2="216" y2="116" stroke="#e0d8f0" stroke-width="1"/>
    <circle cx="40" cy="148" r="4" class="dot"/>
    <text x="52" y="152" class="card-point">Full clone — brute force</text>
    <text x="52" y="168" class="card-point">complete copy</text>
    <circle cx="40" cy="200" r="4" class="dot"/>
    <text x="52" y="204" class="card-point">Clean clone — core</text>
    <text x="52" y="220" class="card-point">packages only</text>
    <circle cx="40" cy="252" r="4" class="dot"/>
    <text x="52" y="256" class="card-point">Standard deps mode</text>
    <text x="52" y="272" class="card-point">(whl packages only)</text>
  </g>

  <!-- Card 3: Dependency Analysis -->
  <g transform="translate(612, 28)" filter="url(#shadow)">
    <rect width="272" height="344" rx="16" fill="url(#card1)" stroke="#e0d8f0" stroke-width="1"/>
    <rect width="272" height="5" rx="3" y="0" fill="url(#accent1)"/>
    <text x="136" y="62" text-anchor="middle" class="card-icon">🔍</text>
    <text x="136" y="100" text-anchor="middle" class="card-title">Dependency Analysis</text>
    <line x1="56" y1="116" x2="216" y2="116" stroke="#e0d8f0" stroke-width="1"/>
    <circle cx="40" cy="148" r="4" class="dot"/>
    <text x="52" y="152" class="card-point">Auto-analyze .py file</text>
    <text x="52" y="168" class="card-point">import statements</text>
    <circle cx="40" cy="200" r="4" class="dot"/>
    <text x="52" y="204" class="card-point">Support requirements.txt</text>
    <text x="52" y="220" class="card-point">&amp; pyproject.toml</text>
    <circle cx="40" cy="252" r="4" class="dot"/>
    <text x="52" y="256" class="card-point">One-click install missing</text>
    <text x="52" y="272" class="card-point">packages</text>
  </g>

  <!-- Card 4: Portable Python -->
  <g transform="translate(906, 28)" filter="url(#shadow)">
    <rect width="272" height="344" rx="16" fill="url(#card1)" stroke="#e0d8f0" stroke-width="1"/>
    <rect width="272" height="5" rx="3" y="0" fill="url(#accent1)"/>
    <text x="136" y="62" text-anchor="middle" class="card-icon">🚀</text>
    <text x="136" y="100" text-anchor="middle" class="card-title">Portable Python</text>
    <line x1="56" y1="116" x2="216" y2="116" stroke="#e0d8f0" stroke-width="1"/>
    <circle cx="40" cy="148" r="4" class="dot"/>
    <text x="52" y="152" class="card-point">Online &amp; offline</text>
    <text x="52" y="168" class="card-point">creation modes</text>
    <circle cx="40" cy="200" r="4" class="dot"/>
    <text x="52" y="204" class="card-point">Bundle project files</text>
    <text x="52" y="220" class="card-point">into package</text>
    <circle cx="40" cy="252" r="4" class="dot"/>
    <text x="52" y="256" class="card-point">Cross-machine</text>
    <text x="52" y="272" class="card-point">deployment ready</text>
  </g>
</svg>